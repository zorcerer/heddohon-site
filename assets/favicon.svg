<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Heddohon">
  <rect width="32" height="32" rx="8" fill="#101114"/>
  <!--
    The crest from `Logo.svelte`, inset to 72% so the tile keeps a margin.
    `scale()` thins the strokes along with the geometry, so these are only
    nudged up from the component's 1.8 and 2.75 — about 17% heavier relative to
    the form, which is what a 16px tab needs. Correcting for the scale *and*
    bumping the weight, which is the obvious mistake here, closes the space
    between the band and the cups and turns the interior into a solid mass.
  -->
  <g transform="translate(4.48 4.48) scale(0.72)" fill="none" stroke="#f4f5f7">
    <circle cx="16" cy="16" r="13.6" stroke-width="2.1"/>
    <path d="M8.98 19.27A7.75 7.75 0 1 1 23.02 19.27" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="6.62" y="17.9" width="4.72" height="8.3" rx="2.36" fill="#f4f5f7" stroke="none"/>
    <rect x="20.66" y="17.9" width="4.72" height="8.3" rx="2.36" fill="#f4f5f7" stroke="none"/>
  </g>
</svg>
